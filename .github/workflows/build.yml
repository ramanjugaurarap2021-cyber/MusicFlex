name: Build MusicFlex APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract MusicFlex project
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 2 -type f | head -50

      - name: Fix Java/Kotlin compatibility
        run: |
          cd extracted/MusicFlexOffline

          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

      - name: Fix Kotlin lambda error
        run: |
          cd extracted/MusicFlexOffline

          sed -i 's/runOnUiThread { if (controller == null) pending.addLast(action) else action() }/runOnUiThread { if (controller == null) pending.addLast { action() } else action() }/' app/src/main/java/com/musicflex/app/MainActivity.kt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: |
          cd extracted/MusicFlexOffline
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlex-debug-apk
          path: extracted/MusicFlexOffline/app/build/outputs/apk/debug/app-debug.apk
